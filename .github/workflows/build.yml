name: Build and Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace
        continue-on-error: true

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/MDReader-debug.apk || true
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/MDReader-release-unsigned.apk || true
          ls -la out

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MDReader-APKs
          path: out/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MD Reader build ${{ github.run_number }}
          body: |
            Automated Android APK build of MD Reader.
            Built from commit ${{ github.sha }} on branch ${{ github.ref_name }}.
          files: out/*.apk
          draft: false
          prerelease: false
